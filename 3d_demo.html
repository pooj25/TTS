<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Tech Solutions | 3D Digital Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0d1f14;
            color: white;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        #ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }
        .glass-panel {
            background: rgba(23, 37, 27, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            pointer-events: auto;
        }
        .green-glow {
            text-shadow: 0 0 20px rgba(73, 107, 79, 0.8);
        }
        .cta-button {
            background: linear-gradient(135deg, #496b4f, #2c4230);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), 0 0 15px rgba(73, 107, 79, 0.5);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-layer" class="max-w-[1600px] mx-auto w-full">
        <header class="flex justify-between items-center w-full">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-white/10 backdrop-blur border border-white/20 rounded-lg flex items-center justify-center font-bold text-xl">
                    TT
                </div>
                <div>
                    <h1 class="font-bold tracking-tight text-2xl uppercase">Track Tech</h1>
                    <p class="text-[10px] tracking-[0.4em] text-gray-400 uppercase">Solutions</p>
                </div>
            </div>
            
            <nav class="hidden md:flex gap-8 text-sm font-medium text-gray-300 pointer-events-auto">
                <a href="#" class="hover:text-white transition">Platform</a>
                <a href="#" class="hover:text-white transition">Apparel</a>
                <a href="#" class="hover:text-white transition">Analytics</a>
                <a href="#" class="hover:text-white transition">About</a>
            </nav>
        </header>

        <main class="flex-1 flex items-center mt-12 md:mt-0">
            <div class="max-w-2xl glass-panel">
                <div class="text-xs uppercase tracking-[0.3em] text-[#9fbaa2] font-semibold mb-6 flex items-center gap-4">
                    <span class="w-12 h-[1px] bg-[#9fbaa2]"></span>
                    Digital Factory Engine
                </div>
                
                <h2 class="text-5xl md:text-7xl font-bold leading-tight mb-6">
                    Connect. <br>
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-[#9fbaa2]">Optimise.</span> <br>
                    <span class="green-glow">Scale.</span>
                </h2>
                
                <p class="text-gray-300 text-lg md:text-xl leading-relaxed mb-10">
                    Real-time 3D visibility into your apparel manufacturing operations. Transform raw data into intelligent insights instantly.
                </p>
                
                <div class="flex gap-6 pointer-events-auto">
                    <button class="cta-button px-8 py-4 rounded-full font-semibold flex items-center gap-3 text-sm tracking-wide uppercase">
                        Explore Factory 
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                    <button class="px-8 py-4 rounded-full font-semibold border border-white/20 hover:bg-white/10 transition text-sm tracking-wide uppercase">
                        View Analytics
                    </button>
                </div>
            </div>
        </main>
        
        <footer class="flex justify-between items-end border-t border-white/10 pt-6">
            <div class="flex gap-12">
                <div>
                    <div class="text-3xl font-bold">99.8%</div>
                    <div class="text-xs text-gray-400 mt-2 uppercase tracking-wider">System Uptime</div>
                </div>
                <div>
                    <div class="text-3xl font-bold text-[#9fbaa2]">+42%</div>
                    <div class="text-xs text-gray-400 mt-2 uppercase tracking-wider">Efficiency Gain</div>
                </div>
            </div>
            
            <div class="text-xs text-gray-500 uppercase tracking-widest hidden md:block">
                Interactive 3D Preview
            </div>
        </footer>
    </div>

    <script>
        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d1f14, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 25;
        camera.position.y = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Core visual elements
        const particlesGroup = new THREE.Group();
        scene.add(particlesGroup);

        // Grid plane representing the factory floor
        const gridHelper = new THREE.GridHelper(100, 50, 0x496b4f, 0x1f3824);
        gridHelper.position.y = -5;
        scene.add(gridHelper);

        // Data points / Nodes geometry
        const geometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        const colorsArray = new Float32Array(particlesCount * 3);

        const color1 = new THREE.Color(0x496b4f); // Darker green
        const color2 = new THREE.Color(0x9fbaa2); // Lighter green
        const color3 = new THREE.Color(0xffffff); // White

        for(let i = 0; i < particlesCount * 3; i+=3) {
            // Position
            posArray[i] = (Math.random() - 0.5) * 60;
            posArray[i+1] = (Math.random() - 0.5) * 40;
            posArray[i+2] = (Math.random() - 0.5) * 60;

            // Colors
            const mixColor = Math.random();
            let finalColor;
            if (mixColor < 0.6) finalColor = color1;
            else if (mixColor < 0.9) finalColor = color2;
            else finalColor = color3;

            colorsArray[i] = finalColor.r;
            colorsArray[i+1] = finalColor.g;
            colorsArray[i+2] = finalColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

        const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(geometry, material);
        particlesGroup.add(particlesMesh);

        // Connections / Lines between nodes to look like a neural network / factory network
        const lineMaterial = new THREE.LineBasicMaterial({ 
            color: 0x496b4f, 
            transparent: true, 
            opacity: 0.15 
        });
        
        // Connect nearby points to form a mesh
        const lineGeometry = new THREE.BufferGeometry();
        const linePositions = [];
        
        for (let i = 0; i < 200; i++) {
            const idx1 = Math.floor(Math.random() * particlesCount) * 3;
            const idx2 = Math.floor(Math.random() * particlesCount) * 3;
            
            linePositions.push(
                posArray[idx1], posArray[idx1+1], posArray[idx1+2],
                posArray[idx2], posArray[idx2+1], posArray[idx2+2]
            );
        }
        
        lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
        particlesGroup.add(linesMesh);

        // Add some glowing spheres
        for(let i=0; i<5; i++) {
            const sphereGeo = new THREE.SphereGeometry(Math.random() * 2 + 1, 32, 32);
            const sphereMat = new THREE.MeshBasicMaterial({ 
                color: 0x496b4f,
                wireframe: true,
                transparent: true,
                opacity: 0.3
            });
            const sphere = new THREE.Mesh(sphereGeo, sphereMat);
            sphere.position.set(
                (Math.random() - 0.5) * 30,
                (Math.random() - 0.5) * 20,
                (Math.random() - 0.5) * 30
            );
            particlesGroup.add(sphere);
        }

        // Mouse Interaction
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const windowHalfX = window.innerWidth / 2;
        const windowHalfY = window.innerHeight / 2;

        document.addEventListener('mousemove', (event) => {
            mouseX = (event.clientX - windowHalfX);
            mouseY = (event.clientY - windowHalfY);
        });

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            targetX = mouseX * 0.001;
            targetY = mouseY * 0.001;

            particlesGroup.rotation.y += 0.002;
            particlesGroup.rotation.x += 0.0005;

            // Add subtle mouse parallax
            camera.position.x += (mouseX * 0.01 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 0.01 - camera.position.y + 5) * 0.05;
            camera.lookAt(scene.position);

            // Animate points
            const positions = geometry.attributes.position.array;
            for(let i = 0; i < particlesCount; i++) {
                const i3 = i * 3;
                positions[i3 + 1] += Math.sin(elapsedTime + positions[i3]) * 0.01;
            }
            geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
